[package]
name = "campus-agent-desktop"
version = "0.1.0"
edition = "2021"
description = "Native Rust desktop client for Campus Agent"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

